name: Quality

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned toolchain
        run: rustup show
      - name: Verify native x86-64 host
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          rustc -vV
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: WASM target check
        run: cargo check -p quantos-wasm --target wasm32-unknown-unknown --locked

  web-quality:
    name: web-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  linux-arm64:
    name: linux-arm64
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned toolchain
        run: rustup show
      - name: Verify native ARM64 host
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          rustc -vV
          rustc -vV | grep -Fx 'host: aarch64-unknown-linux-gnu'
      - name: Native workspace tests
        run: cargo test --workspace --locked

  linux-devcontainer:
    name: linux-devcontainer
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configuration and shell syntax
        run: |
          python3 -m json.tool .devcontainer/devcontainer.json > /dev/null
          bash -n .devcontainer/install-toolchains.sh
          bash -n .devcontainer/verify.sh
      - name: Build the Codespaces development image
        run: docker build --file .devcontainer/Dockerfile --tag quantos-dev:ci .
      - name: Non-root environment and synthetic native CLI smoke
        run: |
          docker run --rm --cpus=2 --memory=4g \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspaces/quantos,readonly" \
            --env CARGO_TARGET_DIR=/tmp/quantos-target \
            quantos-dev:ci bash .devcontainer/verify.sh --smoke
