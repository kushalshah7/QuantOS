[workspace]
members = ["crates/quantos-core", "crates/quantos-wasm", "crates/quantos-cli"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
quantos-core = { path = "crates/quantos-core" }
wasm-bindgen = "=0.2.129"

[workspace.lints.rust]
unsafe_code = "forbid"
